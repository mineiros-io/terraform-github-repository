repos:
  - repo: local
    hooks:
    - id: terraform-validate
      name: terraform-validate
      entry: bash -c 'terraform init && terraform validate'
      language: system
      pass_filenames: false
    - id: tflint
      name: tflint
      entry: bash -c 'tflint --init && tflint'
      language: system
      pass_filenames: false
    - id: terraform-docs
      name: terraform-docs
      entry: terraform-docs .
      language: system
      pass_filenames: false
